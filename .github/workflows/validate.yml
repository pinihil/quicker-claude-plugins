name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plugin checks (+ version bump on pull requests)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/check_plugin.py --base "origin/${{ github.base_ref }}"
          else
            python3 tools/check_plugin.py
          fi

      - name: Claude Code manifest validation
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.294
          claude plugin validate ./plugins/quicker-appraisal
          claude plugin validate .

      - name: Smoke test (fictional form + template, engines v3 and v8)
        run: |
          pip install python-docx==1.1.2 pillow==10.4.0 lxml==5.3.0
          bash tests/smoke_test.sh
