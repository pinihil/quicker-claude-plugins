name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match plugin version
        run: |
          V=$(python3 -c "import json;print(json.load(open('plugins/quicker-appraisal/.claude-plugin/plugin.json'))['version'])")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "tag ${GITHUB_REF_NAME} != plugin version v$V"; exit 1; fi
          python3 tools/check_plugin.py

      - name: Build the uploadable zip
        run: bash tools/build_zip.sh quicker-appraisal

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" \
            --notes "קובץ להעלאה ידנית (Upload a plugin). השינויים: plugins/quicker-appraisal/CHANGELOG.md"
